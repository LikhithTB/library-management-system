server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    # Security headers. The CSP allows only what the app loads: its own
    # scripts and styles, plus Google Fonts (index.html).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Keep API calls same-origin in the browser while forwarding them to the
    # backend service on the Docker network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively; everything else re-validates.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
